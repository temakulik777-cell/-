name: Build Tweak
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Theos
        run: |
          export THEOS=~/theos
          git clone --recursive https://github.com/theos/theos.git $THEOS
          echo "THEOS=$THEOS" >> $GITHUB_ENV
          echo "$THEOS/bin" >> $GITHUB_PATH

      - name: Install Dependencies
        run: |
          brew install ldid xz
          git clone --depth 1 https://github.com/theos/sdks.git ~/sdks
          echo "THEOS_SDKS=~/sdks" >> $GITHUB_ENV

      - name: Fix SDK Path
        run: |
          # Копируем или линкуем доступный SDK под именем, которое требует Makefile
          # В ~/sdks обычно есть iPhoneOS15.6.sdk или подобные. Найдём любой и переименуем.
          AVAILABLE_SDK=$(ls ~/sdks | grep iPhoneOS | head -n 1)
          echo "Доступен SDK: $AVAILABLE_SDK"
          if [ "$AVAILABLE_SDK" != "iPhoneOS16.5.sdk" ]; then
            ln -s ~/sdks/$AVAILABLE_SDK ~/sdks/iPhoneOS16.5.sdk
          fi

      - name: Build TIPA
        run: |
          make package FINALPACKAGE=1 THEOS=~/theos

      - uses: actions/upload-artifact@v4
        with:
          name: VolkovTap-tipa
          path: packages/*.tipa
