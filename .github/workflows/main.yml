name: Build TIPA
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Find Xcode Project
        id: find_project
        run: |
          # Ищем файл .xcodeproj или .xcworkspace во всех папках
          PROJECT_PATH=$(find . -name "*.xcodeproj" -o -name "*.xcworkspace" | head -n 1)
          if [ -z "$PROJECT_PATH" ]; then
            echo "Ошибка: Не найден файл .xcodeproj или .xcworkspace!"
            exit 1
          fi
          echo "Найден проект: $PROJECT_PATH"
          echo "PROJECT_PATH=$PROJECT_PATH" >> $GITHUB_ENV
          
      - name: Build
        run: |
          # Собираем проект
          xcodebuild -project "$PROJECT_PATH" -scheme * -sdk iphoneos -configuration Release CODE_SIGNING_ALLOWED=NO
          
      - name: Package TIPA
        run: |
          # Создаем папку Payload и упаковываем .app в .tipa
          mkdir -p Payload
          find ~/Library/Developer/Xcode/DerivedData -name "*.app" -path "*Release-iphoneos*" -exec cp -r {} Payload/ \;
          zip -r App.tipa Payload
          
      - uses: actions/upload-artifact@v4
        with:
          name: VolkovTap
          path: App.tipa
