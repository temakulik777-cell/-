name: Build Tweak
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Theos
        run: |
          export THEOS=~/theos
          git clone --recursive https://github.com/theos/theos.git $THEOS
          echo "THEOS=$THEOS" >> $GITHUB_ENV
          echo "$THEOS/bin" >> $GITHUB_PATH

      - name: Install Dependencies
        run: |
          brew install ldid xz
          git clone --depth 1 https://github.com/theos/sdks.git /tmp/sdks
          rsync -av --ignore-errors /tmp/sdks/ ~/theos/sdks/ || true

      - name: Fix SDK Path
        run: |
          AVAILABLE_SDK=$(ls ~/theos/sdks | grep iPhoneOS | head -n 1)
          echo "Доступен SDK: $AVAILABLE_SDK"
          if [ "$AVAILABLE_SDK" != "iPhoneOS16.5.sdk" ]; then
            ln -s ~/theos/sdks/$AVAILABLE_SDK ~/theos/sdks/iPhoneOS16.5.sdk
          fi

      - name: Fix THEOS Path in Makefile
        run: |
          # Меняем жёсткий путь на актуальный
          sed -i '' 's|export THEOS=/var/mobile/theos|export THEOS=~/theos|' Makefile
          echo "=== Makefile (первые 10 строк) ==="
          head -10 Makefile
          echo "=== Проверка структуры папок ==="
          ls -la sources/ 2>/dev/null || echo "НЕТ ПАПКИ sources/"
          ls -la sources/KIF/ 2>/dev/null || echo "НЕТ ПАПКИ sources/KIF/"
          ls -la esp/ 2>/dev/null || echo "НЕТ ПАПКИ esp/"
          ls -la headers/ 2>/dev/null || echo "НЕТ ПАПКИ headers/"

      - name: Build TIPA
        run: |
          make package FINALPACKAGE=1 THEOS=~/theos

      - uses: actions/upload-artifact@v4
        with:
          name: VolkovTap-tipa
          path: packages/*.tipa
